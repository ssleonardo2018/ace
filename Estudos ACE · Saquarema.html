<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudos ACE · Saquarema</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f5;--sf:#fff;--tx:#17231d;--mu:#5d6d64;--br:#d9e3dd;--pr:#1f8a5b;--pt:#fff;--wa:#c77b0a;--er:#c0392b;--ok:#1f8a5b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1713;--sf:#18231d;--tx:#e8f1ec;--mu:#9bb0a4;--br:#2b3b33;--pr:#3fbf88;--pt:#06241a;--wa:#e8a33d;--er:#ef6f60;--ok:#3fbf88}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1713;--sf:#18231d;--tx:#e8f1ec;--mu:#9bb0a4;--br:#2b3b33;--pr:#3fbf88;--pt:#06241a;--wa:#e8a33d;--er:#ef6f60;--ok:#3fbf88}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 6px;max-width:1000px;margin:auto}
h1{font-size:1.3rem;margin:0}h2{font-size:1.1rem;margin:0 0 10px}h3{font-size:1rem;margin:12px 0 6px}
.sub{color:var(--mu);font-size:.9rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--br)}
nav button{white-space:nowrap;border:1px solid var(--br);background:var(--sf);color:var(--tx);padding:8px 12px;border-radius:20px;cursor:pointer;font-size:.9rem}
nav button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,select,textarea,button.b{font:inherit;padding:9px 10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
input[type=text],textarea{flex:1 1 180px}textarea{width:100%;min-height:70px}
button.b{background:var(--pr);color:var(--pt);border-color:var(--pr);cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border-color:var(--br)}
button.x{background:transparent;border:0;color:var(--er);cursor:pointer;font-size:1rem}
.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--br)}
.it:last-child{border:0}.it span.t{flex:1}.done .t{text-decoration:line-through;color:var(--mu)}
.bar{height:10px;background:var(--br);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.lab{display:flex;justify-content:space-between;font-size:.85rem;margin-top:6px}
.kan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.col{background:var(--bg);border:1px dashed var(--br);border-radius:12px;padding:10px;min-height:120px}
.k{background:var(--sf);border:1px solid var(--br);border-radius:8px;padding:8px;margin-top:8px;cursor:grab;display:flex;gap:6px;align-items:center}
.k span{flex:1;word-break:break-word}
.timer{font-size:3.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer;font:inherit}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.opt.no{border-color:var(--er);background:color-mix(in srgb,var(--er) 18%,transparent)}
.tip{padding:10px 12px;border-left:4px solid var(--pr);background:var(--bg);margin:8px 0;border-radius:0 8px 8px 0}
.tip.w{border-color:var(--wa)}.tip.e{border-color:var(--er)}
.quote{font-size:1.05rem;font-style:italic;text-align:center;padding:6px}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--wa);color:#111;padding:12px;border-radius:10px;z-index:20;display:none;font-weight:600;text-align:center}
.sec{display:none}.sec.on{display:block}
svg text{fill:var(--mu);font-size:11px}
</style>
</head>
<body>
<div id="toast"></div>
<header><h1>📚 Estudos · Agente de Combate a Endemias</h1><div class="sub">Concurso de Saquarema · Edital 001/2026 (IBAM) · prova em 31/01/2027. Seus dados ficam salvos neste navegador.</div></header>
<nav id="nav"></nav>
<main>
<section class="sec" id="painel"></section>
<section class="sec" id="edital"></section>
<section class="sec" id="cron"></section>
<section class="sec" id="lemb"></section>
<section class="sec" id="kanban"></section>
<section class="sec" id="pomo"></section>
<section class="sec" id="cont"></section>
<section class="sec" id="simu"></section>
<section class="sec" id="desemp"></section>
<section class="sec" id="dicas"></section>
</main>
<script>
const $=s=>document.querySelector(s);
const SUBJ=['Conhecimentos Específicos','Português','Legislação do SUS','Conhecimentos do Município'];
const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const TABS=[['painel','🏠 Painel'],['edital','📋 Edital'],['cron','🗓️ Cronograma'],['lemb','⏰ Lembretes'],['kanban','🧩 Kanban'],['pomo','🍅 Pomodoro'],['cont','📁 Conteúdo'],['simu','📝 Simulado'],['desemp','📈 Desempenho'],['dicas','💡 Dicas']];
let S={};
try{S=JSON.parse(localStorage.getItem('ace1'))||{}}catch(e){}
S=Object.assign({sched:[],rem:[],kan:[],files:[],sims:[],min:{},days:{},exam:'2027-01-31',pomos:0,top:{}},S);S.exam=S.exam||'2027-01-31';mig();
const save=()=>{try{localStorage.setItem('ace1',JSON.stringify(S))}catch(e){toast('Armazenamento cheio: remova arquivos de conteúdo.')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
function toast(m,ms=5000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}
function addMin(subj,m){S.min[subj]=Math.max(0,(S.min[subj]||0)+m);const d=today();S.days[d]=Math.max(0,(S.days[d]||0)+m)}
function bars(obj,max){return Object.entries(obj).map(([k,v])=>`<div class="lab"><span>${esc(k)}</span><span>${v.l}</span></div><div class="bar"><i style="width:${Math.min(100,v.p)}%"></i></div>`).join('')}

/* IndexedDB para áudios */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ace',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbOp(m,k,v){const d=await idb();return new Promise((res,rej)=>{const s=d.transaction('f',m==='get'?'readonly':'readwrite').objectStore('f');const q=m==='put'?s.put(v,k):m==='get'?s.get(k):s.delete(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

/* Navegação */
$('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-id="${t[0]}">${t[1]}</button>`).join('');
const R={painel:rPainel,edital:rEdital,cron:rCron,lemb:rLemb,kanban:rKan,pomo:rPomo,cont:rCont,simu:rSimu,desemp:rDesemp,dicas:rDicas};
function tab(id){document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===id));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));if(id!=='pomo'||!$('#pomo').innerHTML)R[id]();try{history.replaceState(null,'','#'+id)}catch(e){}window.scrollTo(0,0)}

/* Frases */
const FR=['A aprovação é feita de constância, não de intensidade.','Estude hoje o que muita gente vai deixar para amanhã.','Cada questão resolvida é um passo mais perto da sua nomeação.','Disciplina é lembrar o que você quer quando a vontade passa.','Quem cuida da saúde da comunidade começa cuidando do próprio foco.','Pequenos blocos de estudo, todos os dias, vencem maratonas esporádicas.','Você não precisa ser perfeito, precisa ser persistente.','O cansaço passa; a aprovação fica.'];
async function frase(){const el=$('#frase');if(!el)return;el.textContent=FR[Math.floor(Math.random()*FR.length)];try{const c=new AbortController();setTimeout(()=>c.abort(),4000);const r=await fetch('https://api.quotable.io/random?maxLength=110',{signal:c.signal});const j=await r.json();if(j.content)el.textContent='“'+j.content+'” — '+j.author}catch(e){}}

/* Painel */
function streak(){let n=0,d=new Date();while((S.days[d.toISOString().slice(0,10)]||0)>0){n++;d.setDate(d.getDate()-1)}return n}
function accs(){const a={};S.sims.forEach(s=>Object.entries(s.subj).forEach(([k,v])=>{a[k]=a[k]||[0,0];a[k][0]+=v[0];a[k][1]+=v[1]}));return a}
function sugest(){const a=accs(),tot=Object.values(S.min).reduce((x,y)=>x+y,0),med=tot/SUBJ.length,o=[];
SUBJ.forEach(k=>{const v=a[k];if(!v)o.push(['',`<b>${k}</b>: ainda sem simulado. Faça um para medir seu nível.`]);else{const p=Math.round(v[0]/v[1]*100);if(p<60)o.push(['e',`<b>${k}</b>: ${p}% de acertos. <b>Prioridade alta</b> — revise a teoria e refaça os erros.`]);else if(p<80)o.push(['w',`<b>${k}</b>: ${p}% de acertos. Bom caminho; reforce com mais questões.`])}
if(tot>0&&(S.min[k]||0)<med*0.5)o.push(['w',`<b>${k}</b>: pouco tempo de estudo registrado comparado às demais matérias.`])});
if(!o.length&&S.sims.length)o.push(['','Ótimo desempenho! Mantenha a rotina e faça simulados completos.']);return o.map(x=>`<div class="tip ${x[0]}">${x[1]}</div>`).join('')||'<div class="tip">Faça seu primeiro simulado para receber sugestões.</div>'}
function rPainel(){const tot=Object.values(S.min).reduce((x,y)=>x+y,0),ss=S.sims.reduce((x,s)=>x+s.ok,0),st=S.sims.reduce((x,s)=>x+s.t,0),dn=S.sched.filter(x=>x.done).length;
let dias='';if(S.exam){const d=Math.ceil((new Date(S.exam+'T00:00')-new Date())/864e5);dias=d>=0?`<b>${d}</b>dias para a prova`:'<b>—</b>prova já realizada'}else dias='<b>—</b>defina a data da prova';
const sm={};SUBJ.forEach(k=>{const m=S.min[k]||0;sm[k]={p:tot?m/Math.max(...SUBJ.map(x=>S.min[x]||0))*100:0,l:Math.round(m/6)/10+' h'}});
const ult=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);ult.push([d.toISOString().slice(5,10),S.days[d.toISOString().slice(0,10)]||0])}const mx=Math.max(30,...ult.map(x=>x[1]));
$('#painel').innerHTML=`<div class="card"><div class="quote" id="frase"></div><div style="text-align:center"><button class="b g" data-a="frase">Nova frase</button></div></div>
${hojeCard()}<div class="grid"><div class="stat"><b>${Math.round(tot/6)/10} h</b>estudadas</div><div class="stat"><b>${streak()}</b>dias seguidos</div><div class="stat"><b>${S.pomos}</b>pomodoros</div><div class="stat"><b>${st?Math.round(ss/st*100)+'%':'—'}</b>acertos nos simulados</div><div class="stat">${dias}</div><div class="stat"><b>${dn}/${S.sched.length}</b>tarefas do cronograma</div><div class="stat"><b>${Object.values(S.top).filter(Boolean).length}/${TOP.reduce((a,t)=>a+t.length,0)}</b>tópicos do edital</div></div>
<div class="card" style="margin-top:14px"><div class="row"><label>Data da prova: <input type="date" id="exam" value="${S.exam}"></label></div></div>
<div class="card"><h2>Evolução nos estudos (últimos 14 dias, min)</h2><svg viewBox="0 0 280 100" width="100%" role="img" aria-label="Minutos por dia">${ult.map((u,i)=>`<rect x="${i*20+3}" y="${85-u[1]/mx*75}" width="14" height="${u[1]/mx*75}" rx="2" fill="var(--pr)"/><text x="${i*20+10}" y="97" text-anchor="middle" font-size="7">${u[0].slice(3)}</text>`).join('')}</svg></div>
<div class="card"><h2>Matérias estudadas</h2>${bars(sm)}</div><div class="card"><h2>Onde melhorar</h2>${sugest()}</div>${backupCard()}`;
$('#exam').onchange=e=>{S.exam=e.target.value;save();rPainel()};frase();$('#bki').onchange=async e=>{const f=e.target.files[0];if(f)importar(await f.text())}}

/* Cronograma */
function rCron(){$('#cron').innerHTML=`${planCard()}<div class="card"><h2>Novo item de estudo</h2><div class="row"><select id="sd">${opts(DIAS)}</select><select id="ss">${opts(SUBJ)}</select><input type="time" id="sh" value="19:00"><input type="number" id="sm" value="60" min="10" step="5" style="width:90px" title="minutos"></div><div class="row"><input type="text" id="st" placeholder="Tópico (ex.: Dengue – ciclo do Aedes)"><button class="b" data-a="sadd">Adicionar</button></div></div>
${DIAS.map(d=>{const l=S.sched.filter(x=>x.d===d).sort((a,b)=>a.h.localeCompare(b.h));return l.length?`<div class="card"><h2>${d}</h2>${l.map(x=>`<div class="it ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} data-a="sdone" data-id="${x.id}"><span class="t">${x.h} · <b>${esc(x.s)}</b> ${esc(x.t)} (${x.m} min)</span><button class="x" data-a="sdel" data-id="${x.id}" aria-label="Remover">✕</button></div>`).join('')}</div>`:''}).join('')||'<p class="sub">Nenhum item ainda. Marcar como feito soma o tempo ao seu progresso.</p>'}`}

/* Lembretes */
function rLemb(){const l=[...S.rem].sort((a,b)=>a.w.localeCompare(b.w));$('#lemb').innerHTML=`<div class="card"><h2>Novo lembrete</h2><div class="row"><input type="text" id="rt" placeholder="Ex.: Entregar documentos / Revisar Português"><input type="datetime-local" id="rw"><button class="b" data-a="radd">Adicionar</button></div><p class="sub">O alerta aparece enquanto esta página estiver aberta.</p></div><div class="card">${l.map(x=>`<div class="it ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} data-a="rdone" data-id="${x.id}"><span class="t">${new Date(x.w).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · ${esc(x.t)}</span><button class="x" data-a="rdel" data-id="${x.id}">✕</button></div>`).join('')||'<p class="sub">Sem lembretes.</p>'}</div>`}
setInterval(()=>{const n=new Date().toISOString().slice(0,16);let ch=0;S.rem.forEach(r=>{if(!r.done&&!r.n&&new Date(r.w)<=new Date()){r.n=1;ch=1;toast('⏰ '+r.t,15000);beep()}});if(ch){save();if($('#lemb').classList.contains('on'))rLemb()}},20000);

/* Kanban */
const COLS=[['todo','A fazer'],['doing','Estudando'],['done','Concluído']];
function rKan(){$('#kanban').innerHTML=`<div class="card"><div class="row"><input type="text" id="kt" placeholder="Nova tarefa (ex.: Resolver 20 questões de Matemática)"><button class="b" data-a="kadd">Adicionar</button></div></div><div class="kan">${COLS.map(c=>`<div class="col" data-col="${c[0]}"><h3>${c[1]} (${S.kan.filter(k=>k.c===c[0]).length})</h3>${S.kan.filter(k=>k.c===c[0]).map(k=>`<div class="k" draggable="true" data-id="${k.id}"><button class="x" data-a="kmv" data-id="${k.id}" data-d="-1" aria-label="Voltar">◀</button><span>${esc(k.t)}</span><button class="x" data-a="kmv" data-id="${k.id}" data-d="1" aria-label="Avançar">▶</button><button class="x" data-a="kdel" data-id="${k.id}">✕</button></div>`).join('')}</div>`).join('')}</div>`;
document.querySelectorAll('.k').forEach(e=>e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',e.dataset.id));
document.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();const k=S.kan.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(k){k.c=c.dataset.col;save();rKan()}}})}

/* Pomodoro */
const P={mode:'foco',left:1500,end:0,run:0,h:null};const MD={foco:25,pausa:5,longa:15};
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},500)}catch(e){}}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function rPomo(){$('#pomo').innerHTML=`<div class="card"><h2>Pomodoro</h2><div class="row" style="justify-content:center"><select id="pm">${opts(SUBJ)}</select></div><div class="row" style="justify-content:center">${Object.keys(MD).map(m=>`<button class="b ${P.mode===m?'':'g'}" data-a="pmode" data-id="${m}">${m==='foco'?'Foco 25':m==='pausa'?'Pausa 5':'Longa 15'}</button>`).join('')}</div><div class="timer" id="pt">${fmt(P.left)}</div><div class="row" style="justify-content:center"><button class="b" data-a="pgo">${P.run?'Pausar':'Iniciar'}</button><button class="b g" data-a="prs">Zerar</button></div><p class="sub" style="text-align:center">Ao concluir um foco, os 25 min são somados à matéria escolhida. Pomodoros hoje: ${S.days['p'+today()]||0}</p></div>`}
function tick(){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));$('#pt')&&($('#pt').textContent=fmt(P.left));document.title=P.run?fmt(P.left)+' · Estudos ACE':'Estudos ACE · Saquarema';if(P.left<=0){clearInterval(P.h);P.run=0;beep();if(P.mode==='foco'){const s=$('#pm')?$('#pm').value:SUBJ[0];addMin(s,25);S.pomos++;S.days['p'+today()]=(S.days['p'+today()]||0)+1;save();toast('🍅 Foco concluído! Faça uma pausa.')}else toast('Pausa encerrada. Hora de focar!');P.left=MD[P.mode]*60;rPomo()}}

/* Conteúdo */
async function pdfText(buf){const d=await pdfjsLib.getDocument({data:buf}).promise;let t='';for(let i=1;i<=d.numPages&&t.length<150000;i++){const p=await d.getPage(i);t+=(await p.getTextContent()).items.map(x=>x.str).join(' ')+' '}return t.slice(0,150000)}
function rCont(){$('#cont').innerHTML=`<div class="card"><h2>Pasta de conteúdo</h2><div class="row"><select id="cs">${opts(SUBJ)}</select><input type="file" id="cf" accept=".pdf,audio/*" multiple></div><div id="cst" class="sub"></div><h3>Ou cole um texto/resumo</h3><div class="row"><input type="text" id="ctt" placeholder="Título"></div><textarea id="ctx" placeholder="Cole aqui trechos da apostila, do edital, seus resumos…"></textarea><div class="row"><button class="b" data-a="cnote">Salvar texto</button></div></div>
${SUBJ.map(s=>{const l=S.files.filter(f=>f.s===s);return l.length?`<div class="card"><h2>${s}</h2>${l.map(f=>`<div class="it"><span class="t">${f.type==='audio'?'🎧':f.type==='pdf'?'📄':'📝'} ${esc(f.name)} <span class="sub">${f.type==='audio'?'(áudio)':Math.round((f.text||'').length/1000)+'k caracteres'}</span><div id="au${f.id}"></div></span>${f.type==='audio'?`<button class="b g" data-a="fplay" data-id="${f.id}">▶ Ouvir</button>`:''}<button class="x" data-a="fdel" data-id="${f.id}">✕</button></div>`).join('')}</div>`:''}).join('')}`;
$('#cf').onchange=async e=>{const subj=$('#cs').value,st=$('#cst');for(const f of e.target.files){const id=uid();try{if(f.type.startsWith('audio')){st.textContent='Salvando '+f.name+'…';await idbOp('put',id,f);S.files.push({id,s:subj,name:f.name,type:'audio'})}else if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){if(typeof pdfjsLib==='undefined')throw new Error('Leitor de PDF indisponível. Cole o texto manualmente.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';st.textContent='Lendo '+f.name+'…';const t=await pdfText(await f.arrayBuffer());if(t.trim().length<50)throw new Error('PDF sem texto selecionável (escaneado?).');S.files.push({id,s:subj,name:f.name,type:'pdf',text:t})}save()}catch(err){st.textContent='Erro: '+err.message;return}}st.textContent='Pronto!';rCont()}}

/* Simulado */
const SN={E:0,P:1,S:2,M:3};
/* formato: [disciplina, enunciado, CORRETA, errada1, errada2, errada3] — as alternativas são embaralhadas na prova */

function gerarPlano(){const ds=[...document.querySelectorAll('.gd:checked')].map(x=>x.value);if(!ds.length)return toast('Marque ao menos um dia.');

const per=+$('#gm').value,bl=per>=120?2:1,len=per/bl,N=ds.length*bl,W=[.55,.2,.15,.10];
const c=W.map(w=>Math.max(1,Math.round(w*N)));while(c.reduce((a,b)=>a+b)>N)c[c.indexOf(Math.max(...c))]--;while(c.reduce((a,b)=>a+b)<N)c[0]++;
const r=[...c],seq=[];while(seq.length<N){let b=-1,bv=-1;r.forEach((v,i)=>{const q=v/c[i];if(v>0&&(q>bv||(q===bv&&c[i]>c[b]))){bv=q;b=i}});seq.push(b);r[b]--}
const tp=[0,0,0,0],[hh,mm]=($('#gh').value||'19:00').split(':').map(Number);let k=0;S.sched=[];
ds.forEach(d=>{for(let j=0;j<bl;j++){const si=seq[k++],t0=hh*60+mm+j*len,L=TOP[si].filter((_,i)=>!S.top[si+':'+i]),tx=L.length?L[tp[si]++%L.length]:'Revisão geral e questões';S.sched.push({id:uid(),d,s:SUBJ[si],h:String(Math.floor(t0/60)%24).padStart(2,'0')+':'+String(t0%60).padStart(2,'0'),m:len,t:tx.slice(0,70),done:0})}});

const shq=b=>{const o=sh(b[2].map((t,i)=>[t,i===b[3]]));return[b[0],b[1],o.map(x=>x[0]),o.findIndex(x=>x[1])]};
const pickBank=(sj,n)=>sh(BANCO.filter(b=>!sj||b[0]===sj)).slice(0,n).map(shq);
function pdfQs(sj,n){const fs=S.files.filter(f=>f.text&&(!sj||f.s===sj)),q=[];if(!fs.length)return q;for(let i=0;i<n*4&&q.length<n;i++){const c=clozeQ(fs[i%fs.length]);if(c)q.push(c)}return q}
function startSim(){const src=$('#sf').value,sj=$('#sj').value,n=+$('#sn').value;let q=[],ed=0;
if(src==='r'){q=sh(S.err.filter(e=>!sj||e.s===sj)).slice(0,n).map(e=>[...shq([e.s,e.q,e.o,e.a]),e.id])}else if(src==='e'){ed=1;const Q=[20,10,6,4];SUBJ.forEach((s,i)=>{let a=pickBank(s,Q[i]);if(a.length<Q[i])a=a.concat(pdfQs(s,Q[i]-a.length));q=q.concat(a)})}
else{if(src!=='p')q=pickBank(sj,n);if(src!=='b')q=q.concat(pdfQs(sj,src==='p'?n:Math.ceil(n/2)));q=sh(q).slice(0,n)}
if(!q.length)return toast('Sem questões para esse filtro.');sim={q,i:0,a:[],fim:null,lock:0,ed,rev:src==='r'};rQ()}
function fimSim(){if(sim.rev)return fimRev();const sj={};let ok=0;sim.q.forEach((x,i)=>{sj[x[0]]=sj[x[0]]||[0,0];sj[x[0]][1]++;if(sim.a[i]===x[3]){sj[x[0]][0]++;ok++}});S.sims.push({d:today(),t:sim.q.length,ok,subj:sj});regErr();save();const p=Math.round(ok/sim.q.length*100);

if(sj[SUBJ[0]]&&!sj[SUBJ[0]][0])z.push('Conhecimentos Específicos');if(sj[SUBJ[1]]&&!sj[SUBJ[1]][0])z.push('Português');if(a[1]+b[1]>0&&a[0]+b[0]===0)z.push('Legislação do SUS/Município');
nota=`<div class="tip ${e>=54&&!z.length?'':'e'}">Nota estimada na escala do edital: <b>${e}/90</b> (mínimo 54, sem zerar disciplina).${z.length?' Você zerou: '+z.join(', ')+'.':''}</div>`}
sim.fim=`<div class="card"><h2>Resultado: ${ok}/${sim.q.length} (${p}%)</h2>${nota}${bars(Object.fromEntries(Object.entries(sj).map(([k,v])=>[k,{p:v[0]/v[1]*100,l:v[0]+'/'+v[1]}])))}<h3>Erradas</h3>${sim.q.map((x,i)=>sim.a[i]===x[3]?'':`<div class="tip e">${esc(x[1])}<br><b>Correta:</b> ${esc(x[2][x[3]])}</div>`).join('')||'<div class="tip">Você acertou tudo! 🎉</div>'}<h3>Sugestões</h3>${sugest()}</div>`;rSimu()}

function regErr(){sim.q.forEach((x,i)=>{const e=S.err.find(r=>r.id===x[1]);if(sim.a[i]===x[3]){if(e&&++e.st>=2)S.err=S.err.filter(r=>r!==e)}else if(e){e.st=0;e.n++}else S.err.push({id:x[1],s:x[0],q:x[1],o:x[2],a:x[3],n:1,st:0})})}

async function exportar(){const out={app:'ace-saquarema',v:2,at:new Date().toISOString(),S};
if($('#bka')&&$('#bka').checked){out.audio={};for(const f of S.files.filter(f=>f.type==='audio')){try{const b=await idbOp('get',f.id);out.audio[f.id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch(e){}}}
const json=JSON.stringify(out),name='backup-ace-'+today()+'.json';
try{const d=typeof claude!=='undefined'?await claude.use('downloads'):null;if(d){await d.save({filename:name,data:json});toast('Backup salvo.');return}}catch(e){if(e&&e.code==='declined')return}
try{const u=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
const t=$('#bkt');if(t){t.value=json;t.closest('details').open=true;toast('Se o arquivo não baixou, copie o texto da caixa e guarde em um arquivo .json.',9000)}}
async function importar(txt){try{const o=JSON.parse(txt);if(o.app!=='ace-saquarema'||!o.S)throw 0;if(!confirm('Substituir todos os dados atuais pelo backup?'))return;
S=Object.assign({sched:[],rem:[],kan:[],files:[],sims:[],min:{},days:{},exam:'2027-01-31',pomos:0,top:{}},o.S);mig();
if(o.audio)for(const [id,u] of Object.entries(o.audio)){const [h,b]=u.split(',');const m=(h.match(/:(.*?);/)||[])[1]||'audio/mpeg',bin=atob(b),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);await idbOp('put',id,new Blob([arr],{type:m}))}
save();toast('Backup importado!');rPainel()}catch(e){toast('Arquivo de backup inválido.')}}
